apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast-status-api
  namespace: shipfast
  labels:
    app: shipfast-status-api
    app.kubernetes.io/name: shipfast-status-api
    app.kubernetes.io/part-of: shipfast
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipfast-status-api
  template:
    metadata:
      labels:
        app: shipfast-status-api
        app.kubernetes.io/name: shipfast-status-api
        app.kubernetes.io/part-of: shipfast
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: status-api
          image: tierrab/shipfast-status-api:v1.0.0
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: shipfast-status-api-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
